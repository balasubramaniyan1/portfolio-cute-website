<body>
    <div class="container">

        <div class="Section-1">
            <h1 class="Section-1__Name">BalaSubramanian</h1>
            <p class="Section-1__Role">Web Developer</p>
            <a class="Section-1__Contact" href="index.html">Home</a>
        </div>

        <div class="contact-form">
            <form>
                <table>
                    <tr>
                        <td>Name:</td>
                        <td><input class="contact-form__input" type="text" placeholder="Your Name"></td>
                    </tr>
                    <tr>
                        <td>Email:</td>
                        <td><input class="contact-form__input" type="email" placeholder="Your Email"></td>
                    </tr>
                    <tr>
                        <td>Message:</td>
                        <td><textarea class="contact-form__textarea" name="Message"
                                placeholder="Your Message"></textarea></td>
                    </tr>
                    <tr>
                        <td></td>
                        <td><input class="contact-form__submit" type="submit"></td>
                    </tr>
                </table>
            </form>
        </div>

        <div class="Section-5">
            <p class="Section-5__title">Social Media:
                <a href="https://www.instagram.com/balaxx__s_18/">Instagram</a>
                <a href="https://www.LinkedIn.com/in/balasubramanian-s-18024015b?">LinkedIn</a>
            </p>
            <p class="Section-5__Des">&copy; BalaSubramanian</p>
